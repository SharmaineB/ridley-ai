services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ridley
      POSTGRES_PASSWORD: ridley
      POSTGRES_DB: ridley
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridley"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://ridley:ridley@postgres:5432/ridley
      CHROMA_PATH: /data/chroma
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
    volumes:
      - chroma:/data/chroma
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

  n8n:
    image: n8nio/n8n:latest
    profiles: ["automation"]
    ports:
      - "5678:5678"
    volumes:
      - n8n:/home/node/.n8n

volumes:
  pgdata:
  chroma:
  n8n:
